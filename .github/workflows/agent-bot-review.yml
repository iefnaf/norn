name: Agent bot — review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    uses: iefnaf/agent-bot/.github/workflows/review.yml@v1
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
